name: Python

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MATURIN_VERSION: "v1.16.0"
  PACKAGE_DIR: py

jobs:
  linux:
    name: Build / Linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: -m ${{ env.PACKAGE_DIR }}/Cargo.toml --release --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - name: Build sdist
        if: matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m ${{ env.PACKAGE_DIR }}/Cargo.toml --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - name: Import the wheel
        run: |
          python -m pip install "$(find dist -name '*.whl' -type f | head -n 1)"
          python -c "import pgpq; print(pgpq.DEFAULT_BATCH_SIZE)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: Build / macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: -m ${{ env.PACKAGE_DIR }}/Cargo.toml --release --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - name: Import the wheel
        run: |
          python -m pip install "$(find dist -name '*.whl' -type f | head -n 1)"
          python -c "import pgpq; print(pgpq.DEFAULT_BATCH_SIZE)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist

  test:
    name: Test (Python ${{ matrix.python }})
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The runner image has no Python before 3.11. The wheel is abi3, so it
        # installs on older versions too.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      # The runner image ships Postgres without putting it on PATH.
      # testing.postgresql needs initdb and postgres to start a throwaway server.
      - name: Put Postgres on PATH
        run: echo "$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)" >> "$GITHUB_PATH"
      - name: Install the wheel
        run: python -m pip install "$(find dist -name '*.whl' -type f | head -n 1)[test]"
      # Run from the repo root: the encoder tests read snapshots by a path relative to it.
      - run: python -m pytest -v ${{ env.PACKAGE_DIR }}/test_pgpq
